name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -t .
      - name: Tests that need root (container network with real packets, deploy script)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nftables
          sudo "$(command -v python)" -m unittest -v tests.test_pve_netns tests.test_pve_scripts

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x tests/*.sh deploy/pve/*.sh deploy/pve/access/*.sh

